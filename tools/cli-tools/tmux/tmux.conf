
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
bind -n C-q if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z; select-pane -t :.+; resize-pane -Z' 'select-pane -t :.+'


# Vertical split using Ctrl+b then |
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


set -g renumber-windows on

# Fuzzy finder windows
bind-key f display-popup -E -w 70% -h 50% "~/.local/bin/tmux-window-fzf"

